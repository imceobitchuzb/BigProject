version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safeingame-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=sqlite:///./safeingame.db
      - CORS_ORIGINS=["http://localhost:4321","http://localhost:80","http://127.0.0.1:4321"]
    volumes:
      - ./backend/safeingame.db:/app/safeingame.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: safeingame-web
    ports:
      - "4321:80"
    depends_on:
      - backend
    restart: unless-stopped
