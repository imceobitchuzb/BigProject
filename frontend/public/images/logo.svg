<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="shieldGrad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080D18"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="120" y1="80" x2="392" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#FF9F1C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Ambient Glow Ring -->
  <circle cx="256" cy="256" r="236" stroke="url(#cyanGrad)" stroke-width="6" stroke-dasharray="14 10" opacity="0.45"/>
  <circle cx="256" cy="256" r="218" fill="url(#shieldGrad)" stroke="#29384D" stroke-width="4"/>

  <!-- Cybernetic Hexagonal Grid Accents -->
  <path d="M120 180 L256 100 L392 180 V332 L256 412 L120 332 Z" stroke="#22D3EE" stroke-width="2" stroke-opacity="0.2" fill="none"/>
  
  <!-- Main High-Tech Cybersecurity Shield Contour -->
  <path d="M256 96 L384 150 V260 C384 346 328 412 256 440 C184 412 128 346 128 260 V150 Z" 
        fill="#111827" 
        stroke="url(#cyanGrad)" 
        stroke-width="16" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner Shield Core -->
  <path d="M256 124 L360 168 V256 C360 326 314 380 256 404 C198 380 152 326 152 256 V168 Z" 
        fill="#172235" 
        stroke="#29384D" 
        stroke-width="6" 
        stroke-linejoin="round"/>

  <!-- Padlock Shackle / Armor Arch -->
  <path d="M216 230 V196 C216 174 234 156 256 156 C278 156 296 174 296 196 V230" 
        stroke="url(#cyanGrad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        fill="none"/>

  <!-- Padlock Body / Cyber Security Core -->
  <rect x="196" y="224" width="120" height="96" rx="20" fill="#111827" stroke="url(#cyanGrad)" stroke-width="10"/>

  <!-- Keyhole Glow -->
  <circle cx="256" cy="262" r="14" fill="url(#cyanGrad)"/>
  <path d="M250 268 L246 294 H266 L262 268 Z" fill="url(#cyanGrad)"/>

  <!-- Verification Check Badge (Bottom Right Accent) -->
  <g transform="translate(356, 360)">
    <circle cx="0" cy="0" r="44" fill="#111827" stroke="#22D3EE" stroke-width="6"/>
    <circle cx="0" cy="0" r="34" fill="url(#goldGrad)"/>
    <path d="M-12 2 L-3 11 L14 -9" stroke="#111827" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
