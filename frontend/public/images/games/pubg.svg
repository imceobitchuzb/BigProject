<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="pubgHelmet" x1="50" y1="30" x2="150" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="50%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="pubgAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="pubgShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Tactical Dark Container -->
  <rect width="200" height="200" rx="36" fill="#13171F" stroke="#374151" stroke-width="4"/>

  <!-- Military Topographic Contour Curves -->
  <path d="M20 70 Q60 50 110 80 T180 60" stroke="#374151" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
  <path d="M20 110 Q80 130 130 90 T180 120" stroke="#374151" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>
  <path d="M30 150 Q90 120 150 160" stroke="#374151" stroke-width="1.5" stroke-opacity="0.4" fill="none"/>

  <!-- Iconic PUBG Level 3 Spetsnaz Helmet -->
  <g filter="url(#pubgShadow)" transform="translate(100, 94)">
    <!-- Helmet Dome Base -->
    <path d="M-48 -8 C-48 -44 -26 -64 0 -64 C26 -64 48 -44 48 -8 C48 16 42 38 34 50 H-34 C-42 38 -48 16 -48 -8 Z" 
          fill="url(#pubgHelmet)" 
          stroke="#4B5563" 
          stroke-width="5" 
          stroke-linejoin="round"/>

    <!-- Distinctive Steel Face Shield Visor -->
    <path d="M-38 -6 H38 L32 28 H-32 Z" fill="#030712" stroke="#6B7280" stroke-width="4"/>

    <!-- Slotted Vision Aperture (Thin horizontal visor slit) -->
    <rect x="-24" y="6" width="48" height="6" rx="2" fill="#F59E0B"/>
    
    <!-- Helmet Mount Rivets & Hinges -->
    <circle cx="-40" cy="10" r="3.5" fill="#9CA3AF"/>
    <circle cx="40" cy="10" r="3.5" fill="#9CA3AF"/>
    <circle cx="-2" cy="-48" r="3" fill="#6B7280"/>
  </g>

  <!-- Iconic Red/Blue Airdrop Crate (Bottom Right Badge) -->
  <g transform="translate(144, 144)" filter="url(#pubgShadow)">
    <circle cx="0" cy="0" r="26" fill="#111827" stroke="url(#pubgAmber)" stroke-width="3"/>
    <!-- Red Box -->
    <rect x="-13" y="-6" width="26" height="18" fill="#DC2626" rx="2"/>
    <!-- Blue Tarp Top -->
    <path d="M-15 -10 H15 L13 -4 H-13 Z" fill="#2563EB"/>
    <!-- Black Straps -->
    <line x1="-5" y1="-10" x2="-5" y2="12" stroke="#000" stroke-width="2"/>
    <line x1="5" y1="-10" x2="5" y2="12" stroke="#000" stroke-width="2"/>
  </g>

  <!-- "PUBG" Badge -->
  <rect x="24" y="24" width="54" height="20" rx="6" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="51" y="38" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="900" fill="#F59E0B" text-anchor="middle" letter-spacing="1">PUBG</text>
</svg>
