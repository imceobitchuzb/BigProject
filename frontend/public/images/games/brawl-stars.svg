<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bsGold" x1="40" y1="20" x2="160" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
    <linearGradient id="bsGem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="bsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Deep Purple/Navy Rounded Container -->
  <rect width="200" height="200" rx="36" fill="#171A2E" stroke="#3730A3" stroke-width="4"/>

  <!-- Radial Starlight Burst Background -->
  <circle cx="100" cy="100" r="70" fill="#4F46E5" fill-opacity="0.15"/>
  <path d="M100 24 L104 88 L168 92 L106 102 L144 156 L96 114 L56 156 L94 102 L32 92 L96 88 Z" fill="#6366F1" fill-opacity="0.15"/>

  <!-- Iconic Brawl Stars Skull Character Emblem -->
  <g filter="url(#bsShadow)" transform="translate(100, 96)">
    <!-- Skull Outline & Base (Golden Yellow) -->
    <path d="M-46 -36 C-46 -60 -24 -72 0 -72 C24 -72 46 -60 46 -36 C46 -12 40 4 32 14 L30 36 C30 42 24 46 16 46 H-16 C-24 46 -30 42 -30 36 L-32 14 C-40 4 -46 -12 -46 -36 Z" 
          fill="url(#bsGold)" 
          stroke="#1E1B4B" 
          stroke-width="7" 
          stroke-linejoin="round"/>
    
    <!-- Left Eye (Cyan Cross) -->
    <path d="M-28 -40 L-14 -26 M-14 -40 L-28 -26" stroke="#06B6D4" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Right Eye (Dark Hollow) -->
    <circle cx="21" cy="-33" r="10" fill="#1E1B4B"/>
    <circle cx="23" cy="-35" r="4" fill="#FFFFFF"/>

    <!-- Small Nose Hole -->
    <ellipse cx="0" cy="-14" rx="4" ry="3" fill="#1E1B4B"/>

    <!-- Skull Cartoon Teeth Grin -->
    <path d="M-18 20 H18" stroke="#1E1B4B" stroke-width="5" stroke-linecap="round"/>
    <line x1="-8" y1="14" x2="-8" y2="28" stroke="#1E1B4B" stroke-width="5" stroke-linecap="round"/>
    <line x1="8" y1="14" x2="8" y2="28" stroke="#1E1B4B" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Supercell Brawl Gem (Bottom Right Badge) -->
  <g transform="translate(144, 144)" filter="url(#bsShadow)">
    <circle cx="0" cy="0" r="24" fill="#111827" stroke="#10B981" stroke-width="3"/>
    <!-- Emerald Gem Facets -->
    <polygon points="0,-14 13,-4 8,14 -8,14 -13,-4" fill="url(#bsGem)" stroke="#065F46" stroke-width="1.5"/>
    <polygon points="0,-14 6,-4 0,14 -6,-4" fill="#6EE7B7" fill-opacity="0.6"/>
  </g>

  <!-- Game Category Tag -->
  <rect x="24" y="24" width="38" height="20" rx="6" fill="#F59E0B" fill-opacity="0.25" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="43" y="38" font-family="'Space Grotesk', system-ui, sans-serif" font-size="12" font-weight="900" fill="#FBBF24" text-anchor="middle">BS</text>
</svg>
