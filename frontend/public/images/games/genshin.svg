<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="genshinStarGrad" x1="40" y1="20" x2="160" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="30%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="primoFacet1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#A5B4FC"/>
    </linearGradient>
    <linearGradient id="primoFacet2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="genshinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Deep Astral Night Container -->
  <rect width="200" height="200" rx="36" fill="#14142B" stroke="#312E81" stroke-width="4"/>

  <!-- Celestial Constellation Ring & Orbit Rays -->
  <circle cx="100" cy="100" r="70" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="4 6" stroke-opacity="0.3"/>
  <circle cx="100" cy="100" r="52" fill="#4338CA" fill-opacity="0.15"/>
  <path d="M100 20 L100 180 M20 100 L180 100" stroke="#A5B4FC" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Iconic 4-Pointed Genshin Celestial Primogem Star -->
  <g filter="url(#genshinShadow)" transform="translate(100, 94)">
    <!-- Outer Star Sparkle Ray Base -->
    <path d="M0 -62 C6 -24 24 -6 62 0 C24 6 6 24 0 62 C-6 24 -24 6 -62 0 C-24 -6 -6 -24 0 -62 Z" 
          fill="url(#genshinStarGrad)" 
          stroke="#312E81" 
          stroke-width="4" 
          stroke-linejoin="round"/>

    <!-- Inner Faceted Primogem Diamond Core -->
    <polygon points="0,-36 26,0 0,36 -26,0" fill="#4F46E5" stroke="#C084FC" stroke-width="2"/>
    <polygon points="0,-36 26,0 0,0" fill="url(#primoFacet1)"/>
    <polygon points="0,0 26,0 0,36" fill="url(#primoFacet2)"/>
    <polygon points="-26,0 0,-36 0,0" fill="#C7D2FE"/>
    <polygon points="-26,0 0,0 0,36" fill="#6366F1"/>

    <!-- Small Golden Orbit Sparkles -->
    <circle cx="0" cy="0" r="4" fill="#FEF08A"/>
    <circle cx="-38" cy="-38" r="2.5" fill="#FDE047"/>
    <circle cx="38" cy="-38" r="2.5" fill="#FDE047"/>
    <circle cx="38" cy="38" r="2.5" fill="#FDE047"/>
    <circle cx="-38" cy="38" r="2.5" fill="#FDE047"/>
  </g>

  <!-- Paimon Crown / Astral Badge (Bottom Right) -->
  <g transform="translate(144, 144)" filter="url(#genshinShadow)">
    <circle cx="0" cy="0" r="26" fill="#111827" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="0" cy="0" r="20" fill="#1E1B4B"/>
    <!-- Little Crown Motif -->
    <path d="M-10 6 L-10 -4 L-4 0 L0 -8 L4 0 L10 -4 L10 6 Z" fill="#FDE047" stroke="#D97706" stroke-width="1.5"/>
  </g>

  <!-- "GENSHIN" Badge -->
  <rect x="24" y="24" width="46" height="20" rx="6" fill="#818CF8" fill-opacity="0.2" stroke="#818CF8" stroke-width="1.5"/>
  <text x="47" y="38" font-family="'Space Grotesk', system-ui, sans-serif" font-size="10" font-weight="900" fill="#C084FC" text-anchor="middle" letter-spacing="1">RPG</text>
</svg>
