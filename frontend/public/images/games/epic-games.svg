<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="epicGrad" x1="40" y1="20" x2="160" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="vbucksGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <filter id="epicShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Deep Slate/Midnight Container -->
  <rect width="200" height="200" rx="36" fill="#121622" stroke="#252D42" stroke-width="4"/>

  <!-- Radial Speed Lines / Storm Horizon -->
  <circle cx="100" cy="100" r="72" fill="#0EA5E9" fill-opacity="0.1"/>
  <path d="M100 20 L102 70 M100 180 L102 130 M20 100 L70 102 M180 100 L130 102" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Official Epic Games Shield Crest -->
  <g filter="url(#epicShadow)" transform="translate(100, 94)">
    <!-- Outer Shield Crest -->
    <path d="M0 -60 L48 -44 V12 C48 38 28 58 0 70 C-28 58 -48 38 -48 12 V-44 Z" 
          fill="#1E2333" 
          stroke="url(#epicGrad)" 
          stroke-width="5" 
          stroke-linejoin="round"/>

    <!-- Distinctive Stylized Epic "E" Letterform -->
    <path d="M-22 -32 H22 V-18 H-8 V-7 H16 V6 H-8 V18 H22 V32 H-22 Z" 
          fill="#FFFFFF" 
          stroke="#0F172A" 
          stroke-width="2"/>
  </g>

  <!-- Fortnite V-Bucks Coin Badge (Bottom Right) -->
  <g transform="translate(144, 144)" filter="url(#epicShadow)">
    <circle cx="0" cy="0" r="26" fill="#111827" stroke="url(#vbucksGrad)" stroke-width="3"/>
    <circle cx="0" cy="0" r="21" fill="url(#vbucksGrad)"/>
    <!-- V Shape -->
    <text x="0" y="8" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="900" fill="#1E293B" text-anchor="middle">V</text>
  </g>

  <!-- "EPIC" Badge -->
  <rect x="24" y="24" width="46" height="20" rx="6" fill="#0EA5E9" fill-opacity="0.2" stroke="#0EA5E9" stroke-width="1.5"/>
  <text x="47" y="38" font-family="'Space Grotesk', system-ui, sans-serif" font-size="10" font-weight="900" fill="#38BDF8" text-anchor="middle" letter-spacing="1">EPIC</text>
</svg>
