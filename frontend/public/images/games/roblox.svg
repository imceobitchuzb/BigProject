<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="rbxRed" x1="40" y1="30" x2="160" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="rbxCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="rbxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Deep Slate Container -->
  <rect width="200" height="200" rx="36" fill="#141824" stroke="#29384D" stroke-width="4"/>

  <!-- Isometric Pixel Grid Lines -->
  <path d="M100 24 L170 64 V144 L100 184 L30 144 V64 Z" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
  <line x1="100" y1="24" x2="100" y2="184" stroke="#334155" stroke-width="1.5" stroke-opacity="0.3"/>
  <line x1="30" y1="104" x2="170" y2="104" stroke="#334155" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Iconic Official Roblox Tilted Cube / Hollow Square Emblem -->
  <g filter="url(#rbxShadow)" transform="translate(100, 94)">
    <!-- Rotated 14.5 degrees (Official Roblox tilted square) -->
    <g transform="rotate(-15)">
      <!-- Outer Solid Square -->
      <rect x="-44" y="-44" width="88" height="88" rx="8" fill="url(#rbxRed)" stroke="#B91C1C" stroke-width="3"/>
      <!-- Inner Cutout Square (Official Roblox geometry) -->
      <rect x="-14" y="-14" width="28" height="28" rx="3" fill="#141824" stroke="#991B1B" stroke-width="2"/>
    </g>
  </g>

  <!-- Cybersecurity Session Cookie Lock Badge (Bottom Right) -->
  <g transform="translate(144, 144)" filter="url(#rbxShadow)">
    <circle cx="0" cy="0" r="26" fill="#111827" stroke="url(#rbxCyan)" stroke-width="3"/>
    <!-- Padlock Shape -->
    <path d="M-6 -2 V-7 C-6 -10.5 -3.5 -13 0 -13 C3.5 -13 6 -10.5 6 -7 V-2" stroke="#22D3EE" stroke-width="2.5" fill="none"/>
    <rect x="-9" y="-2" width="18" height="14" rx="3" fill="#22D3EE"/>
    <circle cx="0" cy="5" r="2" fill="#111827"/>
  </g>

  <!-- "RBX" Badge -->
  <rect x="24" y="24" width="46" height="20" rx="6" fill="#EF4444" fill-opacity="0.2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="47" y="38" font-family="'Space Grotesk', system-ui, sans-serif" font-size="11" font-weight="900" fill="#F87171" text-anchor="middle" letter-spacing="1">RBX</text>
</svg>
